@startuml
title UC-SP-7 Reconcile with the bank (cohort B)
skinparam shadowing false
skinparam defaultFontName Helvetica
skinparam defaultFontSize 10
skinparam sequenceMessageAlign left
autonumber
actor "Chief accountant (head of the…" as ROLE_ACCOUNTANT
boundary "BTMS: 2 Payments" as B_MOD_BTMS_PAY
control "check by BTMS: 2 Payments" as C_software_MOD_BTMS_PAY
entity "BTMS: 2 Payments" as E_MOD_BTMS_PAY
entity "BTMS: 5 Accounting and report…" as E_MOD_BTMS_ACC
entity "BTMS" as E_SYS_BTMS
